[project]
name = "shopdb2-backend"
version = "0.1.0"
description = "shopdb2 admin backend common skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "email-validator>=2.3.0",
]

[tool.uv]
package = false
